; PHP settings used by every Laravel Github deploy script (passed with `php -c`).
; This replaces the server's main php.ini so hardening such as disable_functions
; (proc_open, posix_*) does not break the plugin's own CLI and GUI scripts.
display_errors = Off
display_startup_errors = Off
log_errors = Off
error_reporting = E_ALL
memory_limit = 256M
max_execution_time = 0
disable_functions =
open_basedir =
register_argc_argv = On
variables_order = "EGPCS"
default_charset = "UTF-8"
